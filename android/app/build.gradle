plugins {
    id "com.android.application"
}

def generatedWebAssets = layout.buildDirectory.dir("generated/webAssets")

android {
    namespace "com.kongkong.englishcards"
    compileSdk 36

    defaultConfig {
        applicationId "com.kongkong.englishcards"
        minSdk 26
        targetSdk 36
        versionCode 6
        versionName "1.5.0"
    }

    buildTypes {
        debug {
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        buildConfig true
    }

    sourceSets {
        main {
            assets.srcDir(generatedWebAssets)
        }
    }
}

tasks.register("syncWebAssets", Sync) {
    from(file("../..")) {
        include "index.html"
        include "styles.css"
        include "app.js"
        include "manifest.webmanifest"
        include "sw.js"
        include "assets/icons/*"
        include "assets/words/*.jpg"
    }
    into(generatedWebAssets)
}

tasks.named("preBuild").configure {
    dependsOn("syncWebAssets")
}
