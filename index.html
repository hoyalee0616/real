<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#fffaf0" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="콩콩 영어" />
    <meta
      name="description"
      content="그림을 보고, 듣고, 따라 말하는 초등 1학년 영어 낱말카드"
    />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%E2%AD%90%3C/text%3E%3C/svg%3E" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="apple-touch-icon" href="assets/icons/app-icon-192.png" />
    <title>콩콩 영어 · 나만의 낱말카드</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="paper-dots" aria-hidden="true"></div>

    <header class="site-header">
      <a class="brand" href="#" aria-label="콩콩 영어 처음으로">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 48 48" fill="none">
            <path d="M24 3.7 29.8 16l13.3 1.7-9.8 9.1 2.5 13.1L24 33.4l-11.8 6.5 2.5-13.1-9.8-9.1L18.2 16 24 3.7Z" fill="currentColor" stroke="#263933" stroke-width="2.5" stroke-linejoin="round"/>
            <path d="M17.5 24c1.1 1.2 2.2 1.8 3.5 1.8s2.4-.6 3.5-1.8c1.1 1.2 2.2 1.8 3.5 1.8s2.4-.6 3.5-1.8" stroke="#263933" stroke-width="2.2" stroke-linecap="round"/>
          </svg>
        </span>
        <span>
          <strong>콩콩 영어</strong>
          <small>나만의 낱말 놀이터</small>
        </span>
      </a>

      <div class="header-actions">
        <div class="progress-pill" aria-label="학습 완료 단어">
          <span class="progress-icon" aria-hidden="true">★</span>
          <span><strong id="learnedCount">0</strong> / <span id="wordCount">10</span> 배웠어요</span>
        </div>
        <button class="button button-primary" id="openAddButton" type="button">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
          내 단어 추가
        </button>
      </div>
    </header>

    <main>
      <section class="welcome" aria-labelledby="welcomeTitle">
        <div>
          <p class="eyebrow"><span aria-hidden="true">●</span> 오늘도 영어 한 걸음</p>
          <h1 id="welcomeTitle">그림을 보고, 듣고,<br /><em>소리 내어 말해 봐요!</em></h1>
          <p>카드를 누르면 단어를 크게 보고 들을 수 있어요.</p>
        </div>
        <div class="welcome-sticker" aria-hidden="true">
          <span class="spark spark-one">✦</span>
          <span class="speech-bubble">Ready?</span>
          <div class="pencil">
            <span class="pencil-tip"></span>
            <span class="pencil-face">•‿•</span>
          </div>
          <span class="spark spark-two">✧</span>
        </div>
      </section>

      <section class="daily-strip" aria-label="오늘의 학습 목표">
        <div class="daily-copy">
          <span class="daily-calendar" aria-hidden="true">10</span>
          <span>
            <small>오늘의 추천 학습</small>
            <strong id="dailyGoalText">10단어 중 0개 완료</strong>
          </span>
        </div>
        <div class="daily-progress-track" aria-hidden="true"><span id="dailyProgressBar"></span></div>
        <button class="daily-start-button" id="startDailyButton" type="button">오늘의 10개 보기</button>
      </section>

      <section class="learning-board" aria-label="영어 낱말 학습">
        <div class="board-toolbar">
          <div class="mode-switch" role="tablist" aria-label="학습 방법">
            <button class="mode-button is-active" id="cardsTab" type="button" role="tab" aria-selected="true" aria-controls="cardsPanel">
              <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="5" width="16" height="14" rx="3"/><path d="m8 15 2.6-2.6a1 1 0 0 1 1.4 0l1.3 1.3 1.2-1.2a1 1 0 0 1 1.4 0L20 16.6M15.5 9.5h.01"/></svg>
              카드 학습
            </button>
            <button class="mode-button" id="quizTab" type="button" role="tab" aria-selected="false" aria-controls="quizPanel">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9.2 9a3 3 0 1 1 5.6 1.5c-.8 1.1-2.8 1.4-2.8 3M12 17.5h.01"/><circle cx="12" cy="12" r="9"/></svg>
              그림 퀴즈
            </button>
            <button class="mode-button" id="reviewTab" type="button" role="tab" aria-selected="false" aria-controls="reviewPanel">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h16v14H4zM8 9h8M8 13h5"/><path d="m16 16 1.5 1.5L21 14"/></svg>
              오답 <span class="wrong-count" id="wrongCount">0</span>
            </button>
          </div>

          <div class="category-filter" id="categoryFilter" aria-label="단어 정렬">
            <button class="filter-button is-active" type="button" data-category="oldest">등록순</button>
            <button class="filter-button" type="button" data-category="alphabetical">알파벳순</button>
            <button class="filter-button" type="button" data-category="newest">신규순</button>
            <button class="filter-button" type="button" data-category="daily">오늘 10개</button>
          </div>
        </div>

        <div id="cardsPanel" role="tabpanel" aria-labelledby="cardsTab">
          <div class="card-grid" id="cardGrid"></div>
          <div class="empty-state" id="emptyState" hidden>
            <span aria-hidden="true">✎</span>
            <h2>아직 단어가 없어요</h2>
            <p>새로운 단어를 직접 등록해 볼까요?</p>
            <button class="button button-primary" type="button" data-open-add>단어 추가하기</button>
          </div>
        </div>

        <div id="quizPanel" role="tabpanel" aria-labelledby="quizTab" hidden>
          <div class="quiz-shell" id="quizShell"></div>
        </div>

        <div id="reviewPanel" role="tabpanel" aria-labelledby="reviewTab" hidden>
          <div class="quiz-shell" id="reviewShell"></div>
        </div>
      </section>
    </main>

    <footer>
      <p>매일 한 단어씩, 천천히 오래 기억해요 <span aria-hidden="true">♥</span></p>
      <a class="apk-download" id="apkDownload" href="KongKong-English-v1.4.apk" download>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12M7 10l5 5 5-5M5 20h14"/></svg>
        안드로이드 앱 다운로드
      </a>
    </footer>

    <dialog class="modal study-modal" id="studyDialog" aria-labelledby="studyWord">
      <div class="modal-frame">
        <button class="icon-button close-button" type="button" data-close-dialog aria-label="닫기">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg>
        </button>
        <div class="study-layout">
          <div class="study-image-wrap">
            <img id="studyImage" src="" alt="" />
            <span class="custom-badge" id="customBadge" hidden>내가 만든 단어</span>
          </div>
          <div class="study-copy">
            <p class="study-kicker">소리 내어 따라 해요!</p>
            <h2 id="studyWord">apple</h2>
            <p class="pronunciation" id="studyPronunciation">애플</p>
            <p class="study-meaning" id="studyMeaning">사과</p>
            <button class="speak-button" id="studySpeakButton" type="button">
              <span class="speaker-circle" aria-hidden="true">
                <svg viewBox="0 0 24 24"><path d="M11 5 6.5 9H3v6h3.5l4.5 4V5ZM15 9.5c.8.7 1.2 1.5 1.2 2.5s-.4 1.8-1.2 2.5M17.8 6.8c1.6 1.4 2.4 3.1 2.4 5.2s-.8 3.8-2.4 5.2"/></svg>
              </span>
              영어로 듣기
            </button>
            <button class="learn-button" id="learnButton" type="button">
              <span aria-hidden="true">☆</span>
              이 단어 배웠어요
            </button>
            <button class="edit-button" id="editWordButton" type="button" hidden>이 단어 수정하기</button>
            <button class="delete-button" id="deleteWordButton" type="button" hidden>이 단어 삭제하기</button>
          </div>
        </div>
        <div class="study-navigation">
          <button class="nav-button" id="previousWordButton" type="button" aria-label="이전 단어">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg>
            이전
          </button>
          <div class="study-dots" id="studyDots" aria-hidden="true"></div>
          <button class="nav-button" id="nextWordButton" type="button" aria-label="다음 단어">
            다음
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg>
          </button>
        </div>
      </div>
    </dialog>

    <dialog class="modal add-modal" id="addDialog" aria-labelledby="addTitle">
      <form class="modal-frame" id="addWordForm" method="dialog">
        <button class="icon-button close-button" type="button" data-close-dialog aria-label="닫기">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg>
        </button>
        <div class="form-heading">
          <span class="form-icon" aria-hidden="true">✎</span>
          <div>
            <p id="formModeLabel">MY WORD CARD</p>
            <h2 id="addTitle">새 단어를 등록해요</h2>
          </div>
        </div>

        <div class="form-grid">
          <label>
            <span>영어 단어</span>
            <input id="englishInput" name="english" type="text" placeholder="예: rabbit" autocomplete="off" maxlength="24" required />
          </label>
          <label>
            <span>한글 뜻</span>
            <input id="koreanInput" name="korean" type="text" placeholder="예: 토끼" autocomplete="off" maxlength="18" required />
          </label>
          <label>
            <span>한글로 읽기 <small>(선택)</small></span>
            <input id="pronunciationInput" name="pronunciation" type="text" placeholder="예: 래빗" autocomplete="off" maxlength="24" />
          </label>
          <label>
            <span>단어 종류</span>
            <select id="categoryInput" name="category">
              <option value="animals">동물</option>
              <option value="nature">자연</option>
              <option value="things">물건</option>
            </select>
          </label>
        </div>

        <div class="ai-generator">
          <button class="ai-generate-button" id="generateImageButton" type="button">
            <span class="ai-spark" aria-hidden="true">✦</span>
            <span>
              <strong>AI 그림 자동 만들기</strong>
              <small>영어 단어를 먼저 입력해 주세요</small>
            </span>
          </button>
          <p id="aiImageStatus" role="status" aria-live="polite"></p>
        </div>

        <label class="image-uploader" id="imageUploader">
          <input id="imageInput" type="file" accept="image/png,image/jpeg,image/webp" />
          <span class="upload-placeholder" id="uploadPlaceholder">
            <span class="upload-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24"><path d="M12 16V4M7 9l5-5 5 5M5 13v6h14v-6"/></svg>
            </span>
            <strong>단어 그림을 골라 주세요</strong>
            <small>JPG, PNG, WEBP · 사진은 카드 크기에 맞춰 저장돼요</small>
          </span>
          <img id="imagePreview" src="" alt="등록할 단어 그림 미리보기" hidden />
        </label>
        <p class="form-error" id="formError" role="alert"></p>

        <div class="form-actions">
          <button class="button button-quiet" type="button" data-close-dialog>취소</button>
          <button class="button button-primary" id="formSubmitButton" type="submit">낱말카드 만들기</button>
        </div>
      </form>
    </dialog>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <script src="app.js"></script>
  </body>
</html>
